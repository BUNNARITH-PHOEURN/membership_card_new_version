<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Digital Membership Card</title>

        <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap"
            rel="stylesheet" />

        <style>
        :root {
            --gold-a: #f8e7af;
            --gold-b: #e6bf78;
            --gold-c: #bf8f3d;
            --gold-d: #f3d489;
            --gold-solid: #ecc987;
            --gold-line: rgba(230, 191, 120, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background:
            radial-gradient(1100px 560px at 50% -12%, rgba(230, 191, 120, 0.1), transparent 60%),
            linear-gradient(160deg, #151517 0%, #0b0b0c 55%, #151517 100%);
            font-family: "Inter", "Noto Sans Khmer", system-ui, Arial, sans-serif;
            padding: 4px 18px;
        }

        /* ---------- CARD SHELL ---------- */
        .member-card {
            position: relative;
            width: 430px;
            max-width: 100%;
            border-radius: 30px;
            padding: 2.5px;
            background: linear-gradient(135deg, var(--gold-a) 0%, var(--gold-c) 42%, var(--gold-d) 70%, var(--gold-b) 100%);
            box-shadow: 0 32px 70px rgba(0, 0, 0, 0.6), 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .card-inner {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            padding: 20px 0;
            background:
            radial-gradient(130% 60% at 50% 0%, rgba(230, 191, 120, 0.13), transparent 62%),
            linear-gradient(180deg, #141417 0%, #0d0d0f 42%, #0d0d0f 100%);
        }

        .card-title {
            text-align: center;
            font-family: "Poppins", sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card-title .g {
            color: var(--gold-solid);
        }

        .photo-zone {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0 6px;
        }

        .accent {
            position: absolute;
            top: 65%;
            height: 20px;
            width: 230px;
            z-index: 1;
            pointer-events: none;
        }

        .accent.l {
            left: -96px;
            transform: translateY(-50%) rotate(34deg);
            background: linear-gradient(90deg, transparent, var(--gold-c), var(--gold-a), transparent);
        }

        .accent.r {
            right: -96px;
            transform: translateY(-50%) rotate(-34deg);
            background: linear-gradient(90deg, transparent, var(--gold-c), var(--gold-a), transparent);
        }

        .accent.l2 {
            left: -78px;
            height: 7px;
            transform: translateY(20px) rotate(34deg);
            opacity: 0.5;
            background: linear-gradient(90deg, transparent, var(--gold-b), transparent);
        }

        .accent.r2 {
            right: -78px;
            height: 7px;
            transform: translateY(20px) rotate(-34deg);
            opacity: 0.5;
            background: linear-gradient(90deg, transparent, var(--gold-b), transparent);
        }

        /* PHOTO: uses background-image so html2canvas keeps the same crop as the browser.
           Change "center" to "center top" if you want to show more of the face. */
        .photo {
            position: relative;
            z-index: 0;
            flex-shrink: 0;
            width: 125px;
            height: 125px;
            border-radius: 5%;
            border: 2px solid var(--gold-solid);
            background-color: #1a1a1e;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .member-name {
            text-align: center;
            font-family: "Poppins", sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 10px 0 0;
        }

        .name-rule {
            width: 76%;
            height: 1px;
            margin: 9px auto 0;
            background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
        }

        .id-block {
            text-align: center;
            margin: 10px 0 0;
        }

        .id-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: var(--gold-solid);
            text-transform: uppercase;
        }

        .id-value {
            font-family: "Poppins", sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            margin-top: 4px;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 18px 2px;
            gap: 10px;
        }

        .qr-frame {
            padding: 10px;
            line-height: 0;
            background: #ffffff;
            border: 2px solid var(--gold-solid);
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        #member-qr img,
        #member-qr canvas {
            display: block;
            border-radius: 4px;
        }

        /* ---------- DOWNLOAD BUTTON ---------- */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold-d), var(--gold-b));
            color: #1c1500;
            font-family: "Inter", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(230, 191, 120, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            text-transform: uppercase;
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn:disabled {
            background: #5f5f63;
            box-shadow: none;
            cursor: not-allowed;
            color: #a9a9ae;
        }

        .error-box {
            max-width: 380px;
            padding: 14px 18px;
            background: #3a2a2a;
            color: #ff9999;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            border: 1px solid var(--gold-solid);
        }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 24px;
            max-width: 460px;
            margin: 0 auto;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 16px;
            background: #14b8cc;
            color: #ffffff;
            font-size: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transform: translateY(140%);
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #d9534f;
        }

        .toast-icon {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffffff;
            color: #14b8cc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast.error .toast-icon {
            color: #d9534f;
        }

        .toast-icon svg {
            width: 16px;
            height: 16px;
        }

        .toast-text {
            flex: 1;
            font-weight: 500;
        }

        .toast-action {
            flex: 0 0 auto;
            background: none;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 4px;
        }

        /* ---------- PREVIEW OVERLAY ---------- */
        .preview-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px;
        }

        .preview-overlay img {
            max-width: 100%;
            max-height: 72vh;
            border-radius: 16px;
            -webkit-touch-callout: default;
            -webkit-user-select: auto;
            user-select: auto;
        }

        .preview-hint {
            color: var(--gold-solid);
            font-size: 14px;
            text-align: center;
            font-weight: 600;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .preview-actions button {
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--gold-d), var(--gold-b));
            color: #1c1500;
        }

        .preview-actions button.secondary {
            background: #2a2a2e;
            color: #fff;
        }
        </style>
    </head>

    <body>
        <!-- MEMBERSHIP CARD -->
        <div id="member-card" class="member-card">
            <div class="card-inner">
                <div class="card-title">
                    <span class="g">Member</span> <span class="g">Card</span>
                </div>
                <div class="photo-zone">
                    <span class="accent l"></span>
                    <span class="accent l2"></span>
                    <span class="accent r"></span>
                    <span class="accent r2"></span>
                    <!-- Photo is now a DIV with background-image (fixes stretched photo when saving) -->
                    <div id="member-photo" class="photo" role="img" aria-label="Member Photo"></div>
                </div>
                <h1 class="member-name" id="member-name">MEMBER</h1>
                <div class="name-rule"></div>

                <div class="id-block">
                    <div class="id-label">Member ID</div>
                    <div class="id-value" id="member-id">CGM2025001</div>
                </div>

                <div class="qr-section">
                    <div class="qr-frame">
                        <div id="member-qr"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DOWNLOAD BUTTON -->
        <button class="download-btn" onclick="downloadCard()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
            </svg>
            Download Card
        </button>

        <!-- TOAST -->
        <div id="toast" class="toast" role="status" aria-live="polite">
            <span class="toast-icon" id="toast-icon"></span>
            <span class="toast-text" id="toast-text"></span>
            <button class="toast-action" id="toast-action" onclick="viewSaved()">ចុចមើល</button>
        </div>

        <!-- PREVIEW OVERLAY -->
        <div id="preview-overlay" class="preview-overlay" hidden>
            <div class="preview-hint" id="preview-hint">
                Press and hold the image, then choose<br />
                "Save to Photos" / "Download image"
            </div>
            <img id="preview-img" alt="Member card" />
            <div class="preview-actions">
                <button class="secondary" onclick="shareCard()">Share</button>
                <button onclick="closePreview()">Close</button>
            </div>
        </div>

        <script>
        // ---- Texts (change here if you want another language) ----
        const TEXT = {
            saved: "កាតត្រូវបានរក្សាទុក",
            view: "ចុចមើល",
            failed: "មានបញ្ហា សូមព្យាយាមម្តងទៀត"
        };

        const CHECK_SVG =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        const CROSS_SVG =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

        // ---- Default data (used when no ?data= param is present) ----
        const DEFAULT_DATA = {
            name: "Bun Narith",
            uniqueId: 1,
            memberId: "0000",
            photo: "SampleProfile.jpg",
        };

        function loadMemberDataFromUrl() {
            const search = window.location.search;
            const dataIndex = search.indexOf("?data=");

            if (dataIndex === -1) {
                populateCard(DEFAULT_DATA);
                return;
            }

            try {
                let raw = search.substring(dataIndex + 6);
                raw = decodeURIComponent(raw);
                raw = raw.replace(/\\([:"&])/g, "$1");
                populateCard(JSON.parse(raw));
            } catch (error) {
                console.error("ERROR:", error);
                showError("Invalid member data.");
                populateCard(DEFAULT_DATA);
            }
        }

        function populateCard(data) {
            document.getElementById("member-name").textContent = data.name;
            document.getElementById("member-id").textContent = data.memberId;

            const imageLinkBase = "https://defaulta6724a3fd9a34397962a5f9455147b.d8.environment.api.powerplatform.com/powerautomate/automations/direct/cu/29/workflows/5262c615e3d64838be0dfaa8b17171d2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=S0vTcSJtv1m6jMc-7uSVL80Ya1K1ebZ6b1hDGo-55gY&siteurl=https://gymmembershipmanagement.sharepoint.com/sites/powerplatform&filepath=/Shared%20Documents/Member_Profile/";

            // Set the photo as a background image (keeps the same crop in the saved image)
            const photoUrl = imageLinkBase + data.photo;
            document.getElementById("member-photo").style.backgroundImage =
                'url("' + photoUrl + '")';

            const qrContainer = document.getElementById("member-qr");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: String(data.uniqueId),
                width: 200,
                height: 200,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function showError(text) {
            const box = document.createElement("div");
            box.className = "error-box";
            box.textContent = text;
            document.body.insertBefore(box, document.getElementById("member-card"));
        }

        window.addEventListener("DOMContentLoaded", loadMemberDataFromUrl);

        // ---- Toast ----
        let toastTimer = null;

        function showToast(text, opts) {
            opts = opts || {};
            const toast = document.getElementById("toast");
            toast.classList.toggle("error", !!opts.error);
            document.getElementById("toast-icon").innerHTML = opts.error ? CROSS_SVG : CHECK_SVG;
            document.getElementById("toast-text").textContent = text;
            document.getElementById("toast-action").hidden = !opts.withView;
            document.getElementById("toast-action").textContent = TEXT.view;

            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("show"), 5000);
        }

        function hideToast() {
            document.getElementById("toast").classList.remove("show");
        }

        // ---- Preview ----
        let cardBlob = null;

        const isIOS =
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        function showPreview(showHint) {
            if (!cardBlob) return;
            const previewImg = document.getElementById("preview-img");
            const oldUrl = previewImg.src;
            if (oldUrl && oldUrl.startsWith("blob:")) URL.revokeObjectURL(oldUrl);
            previewImg.src = URL.createObjectURL(cardBlob);
            document.getElementById("preview-hint").hidden = !showHint;
            document.getElementById("preview-overlay").hidden = false;
        }

        function viewSaved() {
            hideToast();
            showPreview(isIOS);
        }

        function closePreview() {
            document.getElementById("preview-overlay").hidden = true;
        }

        // ---- Save ----
        function saveByDownload(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        async function downloadCard() {
            const card = document.getElementById("member-card");
            const btn = document.querySelector(".download-btn");

            const originalHTML = btn.innerHTML;
            btn.textContent = "Preparing...";
            btn.disabled = true;
            hideToast();

            try {
                const canvas = await html2canvas(card, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: null
                });

                cardBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

                const fileName = "member-card-" + Date.now() + ".png";
                const file = new File([cardBlob], fileName, { type: "image/png" });

                if (isIOS) {
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({ files: [file] });
                            showToast(TEXT.saved, { withView: true });
                        } catch (e) {
                            if (e.name !== "AbortError") showPreview(true);
                        }
                    } else {
                        showPreview(true);
                    }
                } else {
                    saveByDownload(cardBlob, fileName);
                    showToast(TEXT.saved, { withView: true });
                }
            } catch (err) {
                console.error("Image failed:", err);
                showToast(TEXT.failed, { error: true });
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        async function shareCard() {
            if (!cardBlob) return;
            const file = new File([cardBlob], "member-card.png", { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file] });
                } catch (e) {
                    /* cancelled */
                }
            } else {
                alert("Sharing isn't supported here. Please long-press the image to save it.");
            }
        }
        </script>
    </body>
</html>

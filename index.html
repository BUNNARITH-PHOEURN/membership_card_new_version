 <!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Digital Membership Card</title>

        <script
            src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />

        <style>
        :root {
            --bg: #0b0b0c;
            --ink: #ffffff;
            --muted: #b9b9c0;
            --gold-a: #f8e7af;
            --gold-b: #e6bf78;
            --gold-c: #bf8f3d;
            --gold-d: #f3d489;
            --gold-solid: #ecc987;
            --gold-line: rgba(230, 191, 120, 0.28);
            --panel: #0d0d0f;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background:
            radial-gradient(
                1100px 560px at 50% -12%,
                rgba(230, 191, 120, 0.1),
                transparent 60%
            ),
            linear-gradient(160deg, #151517 0%, #0b0b0c 55%, #151517 100%);
            font-family: "Inter", system-ui, Arial, sans-serif;
            padding: 42px 18px;
        }

        /* ---------- CARD SHELL (gold gradient frame) ---------- */
        .student-card {
            position: relative;
            width: 430px;
            max-width: 100%;
            border-radius: 30px;
            padding: 2.5px;
            background: linear-gradient(
            135deg,
            var(--gold-a) 0%,
            var(--gold-c) 42%,
            var(--gold-d) 70%,
            var(--gold-b) 100%
            );
            box-shadow:
            0 32px 70px rgba(0, 0, 0, 0.6),
            0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .card-inner {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background:
            radial-gradient(
                130% 60% at 50% 0%,
                rgba(230, 191, 120, 0.13),
                transparent 62%
            ),
            linear-gradient(180deg, #141417 0%, #0d0d0f 42%, #0d0d0f 100%);
        }

        /* ---------- HEADER ---------- */
        .card-head {
            position: relative;
            padding: 18px 2px 8px;
            text-align: center;
        }

        .logo-mark {
            display: block;
            width: 56px;
            height: 56px;
            margin: 0 auto 6px;
            color: var(--gold-solid);
            filter: drop-shadow(0 4px 10px rgba(230, 191, 120, 0.35));
        }

        /* company logo image (used when a "logo" field is supplied) */
        img.logo-mark {
            width: 96px;
            height: auto;
            margin-bottom: 2px;
            object-fit: contain;
            border-radius: 14px;
        }

        .brand {
            margin: 4px 0 0;
            font-family: "Poppins", sans-serif;
            font-size: 27px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .tagline {
            margin: 9px 0 0;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3.6px;
            color: var(--gold-solid);
            text-transform: uppercase;
        }

        .head-rule {
            width: 26px;
            height: 2px;
            margin: 10px auto 0;
            border-radius: 2px;
            background: var(--gold-solid);
        }

        /* ---------- TITLE ---------- */
        .card-title {
            text-align: center;
            font-family: "Poppins", sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 10px 0 0;
            text-transform: uppercase;
        }

        .card-title .g {
            color: var(--gold-solid);
        }

        .card-title .w {
            color: #ffffff;
        }

        /* ---------- PHOTO ZONE ---------- */
        .photo-zone {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 0 6px;
        }

        .photo-zone::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 210px;
            height: 210px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
            circle,
            rgba(230, 191, 120, 0.2),
            transparent 65%
            );
            z-index: 0;
            pointer-events: none;
        }

        .accent {
            position: absolute;
            top: 55%;
            height: 20px;
            width: 250px;
            z-index: 1;
            pointer-events: none;
        }

        .accent.l {
            left: -96px;
            transform: translateY(-50%) rotate(34deg);
            background: linear-gradient(
            90deg,
            transparent,
            var(--gold-c),
            var(--gold-a),
            transparent
            );
        }

        .accent.r {
            right: -96px;
            transform: translateY(-50%) rotate(-34deg);
            background: linear-gradient(
            90deg,
            transparent,
            var(--gold-c),
            var(--gold-a),
            transparent
            );
        }

        .accent.l2 {
            left: -78px;
            height: 7px;
            transform: translateY(20px) rotate(34deg);
            opacity: 0.5;
            background: linear-gradient(
            90deg,
            transparent,
            var(--gold-b),
            transparent
            );
        }

        .accent.r2 {
            right: -78px;
            height: 7px;
            transform: translateY(20px) rotate(-34deg);
            opacity: 0.5;
            background: linear-gradient(
            90deg,
            transparent,
            var(--gold-b),
            transparent
            );
        }

        .photo {
            position: relative;
            z-index: 3;
            display: block;
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold-solid);
            box-shadow:
            0 0 0 7px rgba(230, 191, 120, 0.12),
            0 0 0 8px rgba(0, 0, 0, 0.35),
            0 18px 38px rgba(0, 0, 0, 0.55);
            background: #1a1a1e;
        }

        /* ---------- NAME ---------- */
        .member-name {
            text-align: center;
            font-family: "Poppins", sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 10px 0 0;
        }

        .name-rule {
            width: 76%;
            height: 1px;
            margin: 9px auto 0;
            background: linear-gradient(
            90deg,
            transparent,
            var(--gold-line),
            transparent
            );
        }

        /* ---------- ID ---------- */
        .id-block {
            text-align: center;
            margin: 10px 0 0;
        }

        .id-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: var(--gold-solid);
            text-transform: uppercase;
        }

        .id-value {
            font-family: "Poppins", sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(120, 230, 150, 0.14);
            color: #7fe6a0;
            border: 1px solid rgba(120, 230, 150, 0.4);
        }

        .status-badge.inactive {
            background: rgba(230, 120, 120, 0.14);
            color: #ff9999;
            border: 1px solid rgba(230, 120, 120, 0.4);
        }

        /* ---------- QR + DATES ---------- */
        .qr-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 10px 18px 2px;
        }

        .date-col {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .date-col svg {
            display: block;
            width: 22px;
            height: 22px;
            margin: 0 auto 8px;
            color: var(--gold-solid);
        }

        .date-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--gold-solid);
            text-transform: uppercase;
        }

        .date-value {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-top: 4px;
            white-space: nowrap;
        }

        .qr-frame {
            flex: 0.5;
            padding: 10px;
            line-height: 0;
            background: #ffffff;
            border: 2px solid var(--gold-solid);
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
        }

        #student-qr img,
        #student-qr canvas {
            display: block;
            border-radius: 4px;
        }

        /* ---------- FEATURES ---------- */
        .features {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 20px 0;
            padding: 11px 0;
            border-top: 1px solid var(--gold-line);
            border-bottom: 1px solid var(--gold-line);
        }

        .feat {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .feat + .feat::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 20px;
            background: var(--gold-line);
        }

        .feat svg {
            width: 15px;
            height: 15px;
            color: var(--gold-solid);
            flex: 0 0 auto;
        }

        .feat span {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: var(--gold-solid);
            text-transform: uppercase;
        }

        /* ---------- NARROW SCREEN FIX ---------- */
        @media (max-width: 360px) {
            .features {
            flex-wrap: wrap;
            margin: 10px 12px 0;
            }

            .feat {
            flex: 1 1 46%;
            padding: 6px 0;
            }

            .feat + .feat::before {
            display: none;
            }
        }

        /* ---------- FOOTER ---------- */
        .card-foot {
            margin-top: 10px;
            padding: 11px 16px;
            text-align: center;
            background: linear-gradient(180deg, var(--gold-a) 0%, var(--gold-c) 100%);
            color: #1c1500;
            font-family: "Poppins", sans-serif;
        }

        .card-foot .small {
            display: block;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.78;
        }

        .card-foot .big {
            display: block;
            margin-top: 3px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ---------- DOWNLOAD BUTTON ---------- */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold-d), var(--gold-b));
            color: #1c1500;
            font-family: "Inter", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(230, 191, 120, 0.35);
            transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            background 0.15s ease;
            text-transform: uppercase;
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 42px rgba(230, 191, 120, 0.5);
            background: linear-gradient(135deg, #f8e7af, var(--gold-d));
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn:disabled {
            background: #5f5f63;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            color: #a9a9ae;
        }

        .status-msg {
            font-size: 13px;
            color: var(--gold-solid);
            text-align: center;
            min-height: 18px;
        }

        .error-box {
            max-width: 380px;
            padding: 14px 18px;
            background: #3a2a2a;
            color: #ff9999;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            border: 1px solid var(--gold-solid);
        }
        </style>
    </head>

        <script>
         // ---- Default data (used when no ?data= param is present) ----
    const DEFAULT_DATA = {
        school: "Gym Membership Card",
        name: "Bun Narith",
        studentId: "0001",
        startDate: "29 Aug 2026",
        endDate: "29 Aug 2027",
        photo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5QM47wVRlSGYSqun44_rFYkfbVtj2fDqSXjXmymP1iCakE1nAgpgA2Fw&s=10",
        active: true
    };
    
    // ---- Read JSON from the ?data= query param and populate the card ----
    function loadStudentDataFromUrl() {

    // Get everything after "?data="
    const search = window.location.search;
    const dataIndex = search.indexOf("?data=");

    if (dataIndex === -1) {
        populateCard(DEFAULT_DATA);
        return;
    }

    try {

        // Get the COMPLETE data string
        let raw = search.substring(dataIndex + 6);

        console.log("RAW URL DATA:");
        console.log(raw);

        // Decode %22, %20, etc.
        raw = decodeURIComponent(raw);

        console.log("DECODED DATA:");
        console.log(raw);

        // Remove unnecessary backslashes
        // Example:
        // \:  -> :
        // \&  -> &
        // \"  -> "
        raw = raw.replace(/\\([:"&])/g, "$1");

        console.log("CLEAN DATA:");
        console.log(raw);

        // Convert JSON string to object
        const student = JSON.parse(raw);

        console.log("STUDENT OBJECT:");
        console.log(student);

        // Show data on card
        populateCard(student);

    } catch (error) {

        console.error("ERROR:", error);

        showError("Invalid student data.");

        populateCard(DEFAULT_DATA);
    }
}

    function populateCard(data) {
        document.getElementById("school-name").textContent = data.school;
        document.getElementById("student-name").textContent = data.name;
        document.getElementById("student-id").textContent = data.studentId;
        document.getElementById("start-date").textContent = data.startDate;
        document.getElementById("end-date").textContent = data.endDate;
        document.getElementById("student-photo").src = data.photo;

        // const badge = document.getElementById("status-badge");
        // if (data.active) {
        //     badge.textContent = "✓ ACTIVE STUDENT";
        //     badge.classList.remove("inactive");
        // } else {
        //     badge.textContent = "✕ INACTIVE STUDENT";
        //     badge.classList.add("inactive");
        // }

        // Remove previous QR
        const qrContainer = document.getElementById("student-qr");
        qrContainer.innerHTML = "";

        // Generate QR
        new QRCode(qrContainer, {
            text: data.studentId,
            width: 100,
            height: 100,
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function showError(text) {
        const box = document.createElement("div");
        box.className = "error-box";
        box.textContent = text;
        document.body.insertBefore(box, document.getElementById("student-card"));
    }

    window.addEventListener("DOMContentLoaded", loadStudentDataFromUrl);

    // ---- Download / share button (unchanged) ----
    async function downloadCard() {
        const card = document.getElementById("student-card");
        const btn = document.querySelector(".download-btn");
        const msg = document.getElementById("status-msg");

        const originalText = btn.textContent;
        btn.textContent = "Preparing...";
        btn.disabled = true;
        msg.textContent = "";

        try {
            const canvas = await html2canvas(card, {
                scale: 3,
                useCORS: true,
                backgroundColor: "#ffffff"
            });

            const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
            const fileName = "student-card.png";
            const file = new File([blob], fileName, { type: "image/png" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: "Student Card",
                });
                msg.textContent = "Shared! Choose 'Save Image' to store it.";
            } else if ("download" in document.createElement("a")) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.download = fileName;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                msg.textContent = "Saved to your Downloads folder.";
            } else {
                const url = URL.createObjectURL(blob);
                window.open(url, "_blank");
                msg.textContent = "Opened in a new tab — long-press to save.";
            }
        } catch (err) {
            console.error("Download failed:", err);
            if (err && err.name === "AbortError") {
                msg.textContent = "Share cancelled.";
            } else {
                msg.textContent = "Something went wrong. Please try again.";
            }
        } finally {
            btn.textContent = originalText;
            btn.disabled = false;
        }
    }

    </script>
    </body>
